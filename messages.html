<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pesan Masuk - WebKita</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                WebKita
            </a>

            <a href="contact.html" class="btn btn-light">
                Kembali ke Contact
            </a>
        </div>
    </nav>

    <!-- Pesan Masuk -->
    <section class="py-5">
        <div class="container">

            <h1 class="fw-bold mb-2">Pesan Masuk</h1>

            <p class="text-muted mb-4">
                Daftar pesan yang dikirim melalui halaman Contact.
            </p>

            <div id="daftarPesan"></div>

        </div>
    </section>

    <script>
        let pesan = JSON.parse(localStorage.getItem("pesanMasuk")) || [];

        let daftarPesan = document.getElementById("daftarPesan");

        if (pesan.length === 0) {

            daftarPesan.innerHTML = `
                <div class="alert alert-info">
                    Belum ada pesan masuk.
                </div>
            `;

        } else {

            pesan.forEach(function(data, index) {

                daftarPesan.innerHTML += `
                    <div class="card shadow-sm mb-3">
                        <div class="card-body">

                            <h5 class="fw-bold">
                                ${data.nama}
                            </h5>

                            <p class="mb-1">
                                <strong>Email:</strong> ${data.email}
                            </p>

                            <p>
                                <strong>Pesan:</strong><br>
                                ${data.pesan}
                            </p>

                            <button
                                class="btn btn-danger btn-sm"
                                onclick="hapusPesan(${index})">
                                Hapus
                            </button>

                        </div>
                    </div>
                `;

            });
        }

        function hapusPesan(index) {

            pesan.splice(index, 1);

            localStorage.setItem(
                "pesanMasuk",
                JSON.stringify(pesan)
            );

            location.reload();
        }
    </script>

</body>
</html>
